[package]
name = "enki-planet"
version = "0.1.0"
edition = "2021"

[dependencies]
glam = "0.33.1"
enki-render = { path = "../enki-render" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Headless heightmap PNG dump (river verification) — reuses the workspace `image`.
image = { version = "0.25", default-features = false, features = ["png"] }
