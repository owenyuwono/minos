[package]
name = "minos-app"
version = "0.1.0"
edition = "2021"
# Two bins are buildable in the default build (flora is on), so a bare
# `cargo run -p minos-app` is ambiguous without this.
default-run = "minos"

[features]
default = ["flora", "voxel"]
# Plug-and-play deterministic procedural flora. ON by default → the minos bin
# scatters trees on the planet surface; drop it with `--no-default-features`.
# Pulls in ash + naga for the flora-OWNED Vulkan
# sub-renderer (flora_render.rs), which builds its own pipelines/descriptor sets
# from raw RHI handles (egui-ash-renderer precedent). Still fully gated/deletable:
# off → none of this compiles.
flora = ["dep:minos-flora", "dep:ash", "dep:naga", "dep:image"]
# On-demand voxel/SDF terrain (transvoxel). Phase 1+ of the voxel migration that
# replaces the Nanite-baked planet surface. Self-contained & deletable: off →
# none of minos-voxel compiles, app falls back to the classic quadtree.
voxel = ["dep:minos-voxel"]

[lib]
name = "minos_app"
path = "src/lib.rs"

[[bin]]
name = "minos"
path = "src/main.rs"

# Standalone flora debug viewer. Only builds with `--features flora`.
[[bin]]
name = "flora_viewer"
path = "src/bin/flora_viewer.rs"
required-features = ["flora"]

[dependencies]
minos-voxel = { version = "0.1.0", path = "../minos-voxel", optional = true }
minos-flora = { version = "0.1.0", path = "../minos-flora", optional = true }
# Flora-only: same ash + naga versions as minos-rhi so the raw vk handles + the
# WGSL→SPIR-V frontend match exactly. Both are `optional` → only built with flora.
ash = { version = "0.38", optional = true }
naga = { version = "29.0.3", features = ["wgsl-in", "spv-out"], optional = true }
# Flora-only: Radiance .hdr decode for the IBL equirect (dryad's HDRI) + PNG
# encode for the headless screenshot capture (FLORA_SCREENSHOT). hdr+png only
# (no default formats) keeps it lean — Rgb32F radiance in, RGBA8 PNG out.
image = { version = "0.25", default-features = false, features = ["hdr", "png"], optional = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
egui = { version = "0.33", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.33", default-features = false }
egui-ash-renderer = { version = "0.11.0", default-features = false, features = ["dynamic-rendering"] }
minos-jobs = { version = "0.1.0", path = "../minos-jobs" }
minos-planet = { version = "0.1.0", path = "../minos-planet" }
minos-render = { version = "0.1.0", path = "../minos-render" }
minos-rhi = { version = "0.1.0", path = "../minos-rhi" }
env_logger = "0.11.10"
glam = "0.33.1"
log = "0.4.32"
lru = "0.12"
# Optimized FFT for the spectral ocean — lets the CPU sim run at poseidon's
# N=256 × 3 cascades (the hand-rolled radix-2 was only viable at N≤64).
rustfft = "6"
raw-window-handle = "0.6"
winit = "0.30"

[dev-dependencies]
# Headless WGSL validation for the wind overlay shader (the flora build pulls
# naga in as a normal dep; tests need it in the default build too).
naga = { version = "29.0.3", features = ["wgsl-in"] }
